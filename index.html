<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dodge Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="gameField">
    <section id="score-box">
      <div class="score-sub-box">
        <div id="score-label">Score</div>
        <div id="score-value">0</div>
      </div>
      
      <div id="highscore-box" class="score-sub-box hidden">
        <div id="highscore-label">High Score</div>
        <div id="highscore-value">0</div>
      </div>
    </section>

    <section id="lives">
      <div id="lives-label">Lives</div>
      <div id="lives-hearts"></div>
    </section>

    <section id="start-screen" class="screen">
      <div class="screen-content">
        <h1>Dodge Game</h1>
        <div id="menu-highscore">BEST RUN: <span id="menu-highscore-value">0</span></div>
        <div class="btn-group">
          <button id="start-btn">PLAY GAME</button>
          <button id="how-to-btn">HOW TO PLAY</button>
        </div>
      </div>
    </section>

    <section id="game-over-screen" class="screen hidden">
      <div class="screen-content">
        <h2>GAME OVER</h2>
        <p class="sub-title">YOUR FINAL SCORE</p>
        <div id="final-score">0</div>
        
        <div id="game-over-highscore" class="gradient-rainbow">
          HIGH SCORE: <span id="game-over-highscore-value">0</span>
        </div>
        
        <button id="restart-btn">PLAY AGAIN</button>
      </div>
    </section>

    <section id="how-to-modal" class="screen hidden">
      <div class="screen-content modal-window">
        <h2>HOW TO PLAY</h2>
        <div class="modal-content">
          <p>⚡ Use <b>Left/Right Arrows</b> or <b>A/D keys</b> to move your neon platform.</p>
          <p>❌ Avoid falling <b>red glitches</b>.</p>
          <p>❤️ You have 3 lives. Every dodge gives you +10 points!</p>
        </div>
        <button id="close-modal-btn">CLOSE</button>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
